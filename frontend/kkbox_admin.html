<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KKBOX 이탈방지 관리자 콘솔 (React)</title>
<style>
body { margin:0; }
.viz-root {
  --surface-1: #fcfcfb;
  --page-plane: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --muted-ink: #898781;
  --gridline: #e1e0d9;
  --baseline: #c3c2b7;
  --border-hairline: rgba(11, 11, 11, 0.1);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --seq-250: #86b6ef;
  --seq-350: #5598e7;
  --seq-450: #2a78d6;
  --seq-550: #1c5cab;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --success-text: #006300;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page-plane);
  color: var(--text-primary);
}
#root { min-height: 100vh; }

.app-root { display: flex; flex-direction: column; min-height: 100vh; }

.top-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; background: var(--surface-1); border-bottom: 1px solid var(--border-hairline);
  position: sticky; top: 0; z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--series-1); color: #fff;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
}
.brand-title { font-weight: 700; font-size: 14.5px; color: var(--text-primary); }
.brand-sub { font-size: 11.5px; color: var(--muted-ink); }

.tab-nav { display: flex; gap: 4px; background: var(--page-plane); border-radius: 10px; padding: 4px; }
.tab-btn {
  border: none; background: transparent; padding: 8px 18px; border-radius: 8px; font-size: 13px;
  font-weight: 600; color: var(--text-secondary); cursor: pointer;
}
.tab-btn.tab-active { background: var(--series-1); color: #fff; }

.main-content { flex: 1; padding: 22px 28px 40px 28px; max-width: 1180px; margin: 0 auto; width: 100%; }
.section-intro { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px 0; }
.small-muted { font-size: 11.5px; color: var(--muted-ink); }

.page-footer {
  font-size: 10.5px; color: var(--muted-ink); text-align: center; padding: 14px 20px 24px 20px;
  border-top: 1px solid var(--border-hairline); background: var(--surface-1);
}

/* ---------- phone mockups ---------- */
.phone-row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: flex-start; }
.phone-frame { width: 260px; }
.phone-statusbar {
  display: flex; justify-content: space-between; font-size: 10px; color: #fff;
  background: #1a1a19; padding: 5px 14px; border-radius: 20px 20px 0 0; font-weight: 600;
}
.phone-screen {
  background: var(--surface-1); border: 1px solid var(--border-hairline); border-top: none;
  border-radius: 0 0 20px 20px; min-height: 420px; padding: 0;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}
.phone-caption { text-align: center; font-size: 11.5px; color: var(--text-secondary); margin-top: 8px; font-weight: 600; }

.app-body { padding: 14px 14px 18px 14px; }
.app-header { font-weight: 700; font-size: 14px; margin-bottom: 12px; }

.reminder-banner {
  display: flex; align-items: flex-start; gap: 8px; background: #fff2ea; border: 1px solid #f3ded3;
  border-radius: 10px; padding: 10px 12px; position: relative;
}
.reminder-icon { font-size: 18px; }
.reminder-text b { font-size: 12.5px; display: block; }
.reminder-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

.row { display: flex; align-items: center; }
.gap8 { gap: 8px; }

.btn {
  border: none; border-radius: 7px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-primary { background: var(--series-2); color: #fff; }
.btn-ghost { background: #fff; color: var(--series-2); border: 1.3px solid var(--series-2); }
.btn-sm { padding: 6px 11px; font-size: 11px; }

.tier-toggle { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
.pill {
  border: 1px solid var(--border-hairline); background: #fff; border-radius: 14px; padding: 4px 11px;
  font-size: 10.5px; cursor: pointer; color: var(--text-secondary);
}
.pill-active { background: var(--series-1); color: #fff; border-color: var(--series-1); }

.mock-card-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.mock-card {
  background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 8px; padding: 9px 11px; font-size: 11.5px;
}

.report-title { font-weight: 700; font-size: 13.5px; margin-bottom: 10px; }
.report-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
.report-tile {
  background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 9px; padding: 8px 6px; text-align: center;
}
.report-emoji { font-size: 15px; }
.report-num { font-weight: 800; font-size: 12.5px; margin-top: 3px; }
.report-label { font-size: 9.5px; color: var(--muted-ink); margin-top: 1px; }
.delta-up { font-size: 9px; color: var(--success-text); font-weight: 700; margin-top: 2px; }

.winback-hero {
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
  background: #eefaf1; border: 1px solid #cdeed7; border-radius: 10px; padding: 14px;
}
.winback-hero b { font-size: 13px; }

.chip {
  display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 10px;
  background: #ece9fb; color: #4a3d99;
}
.chip-sm { font-size: 9.5px; padding: 1px 7px; }
.chip-accent { background: #fff2ea; color: #a8431a; }
.chip-good { background: #e6f6e6; color: var(--success-text); }
.chip-warning { background: #fff3d6; color: #8a5e00; }
.chip-critical { background: #fbdcd6; color: #a8281a; }

/* ---------- dashboard ---------- */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.kpi-row-2x2 { grid-template-columns: 1fr 1fr; }

.stat-tile {
  background: var(--surface-1); border: 1px solid var(--border-hairline); border-radius: 10px; padding: 12px 14px;
  border-left: 3px solid var(--baseline);
}
.stat-tile.stat-good { border-left-color: var(--status-good); }
.stat-tile.stat-warning { border-left-color: var(--status-warning); }
.stat-tile.stat-critical { border-left-color: var(--status-critical); }
.stat-tile.stat-muted { border-left-color: var(--muted-ink); }
.stat-label { font-size: 10.5px; color: var(--muted-ink); margin-bottom: 4px; }
.stat-value { font-size: 19px; font-weight: 800; color: var(--text-primary); }
.stat-sub { font-size: 10px; color: var(--text-secondary); margin-top: 3px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
.panel {
  background: var(--surface-1); border: 1px solid var(--border-hairline); border-radius: 12px; padding: 16px 18px; margin-bottom: 18px;
}
.panel-title { font-weight: 700; font-size: 13px; margin-bottom: 12px; color: var(--text-primary); }

/* horizontal bar chart */
.hbar-chart { display: flex; flex-direction: column; gap: 9px; }
.hbar-row { display: grid; grid-template-columns: 150px 1fr 70px; align-items: center; gap: 8px; }
.hbar-label { display: flex; flex-direction: column; overflow: hidden; }
.hbar-label-main { font-size: 11px; color: var(--text-primary); font-weight: 600; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
.hbar-label-sub { font-size: 9px; color: var(--muted-ink); font-family: 'DejaVu Sans Mono', monospace; }
.hbar-track { background: var(--page-plane); border-radius: 4px; overflow: hidden; position: relative; }
.hbar-fill { height: 100%; border-radius: 4px; min-width: 3px; }
.hbar-value { font-size: 10.5px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }

/* line chart */
.line-chart { width: 100%; height: auto; }
.gridline { stroke: var(--gridline); stroke-width: 1; }
.axis-label { font-size: 9px; fill: var(--muted-ink); }
.point-label { font-size: 9.5px; fill: var(--text-primary); font-weight: 700; }
.line-mark { stroke: var(--series-1); stroke-width: 2; }
.line-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }

/* action center */
.action-center { display: flex; flex-direction: column; }
.ac-filters { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 14px; flex-wrap: wrap; }
.filter-block { display: flex; flex-direction: column; gap: 4px; }
.filter-label { font-size: 10px; color: var(--muted-ink); font-weight: 700; }
.select {
  border: 1px solid var(--border-hairline); border-radius: 7px; padding: 6px 9px; font-size: 11.5px;
  background: #fff; color: var(--text-primary);
}
.filter-count { font-size: 11.5px; color: var(--text-secondary); margin-left: auto; }
.filter-count b { color: var(--series-2); font-size: 13px; }

.ac-lifecycle-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.lifecycle-tab {
  border: 1px solid var(--border-hairline); background: #fff; color: var(--text-secondary);
  border-radius: 999px; padding: 6px 13px; font-size: 11px; font-weight: 700; cursor: pointer;
}
.lifecycle-tab:hover { border-color: var(--series-1); }
.lifecycle-tab.lifecycle-tab-active { background: var(--series-1); color: #fff; border-color: var(--series-1); }

.observed-note { font-size: 10px; color: var(--muted-ink); margin: 2px 0 10px; }

.ac-body { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
.ac-list-col { display: flex; flex-direction: column; min-width: 0; }
.ac-table-wrap { border: 1px solid var(--gridline); border-radius: 8px; overflow: hidden; max-height: 340px; overflow-y: auto; }
.ac-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.ac-pagination { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px 0 2px; }
.ac-table thead th {
  position: sticky; top: 0; background: var(--page-plane); text-align: left; padding: 7px 9px;
  font-size: 10px; color: var(--muted-ink); border-bottom: 1px solid var(--gridline);
}
.ac-table tbody td { padding: 7px 9px; border-bottom: 1px solid var(--gridline); }
.ac-table tbody tr { cursor: pointer; }
.ac-table tbody tr:hover { background: var(--page-plane); }
.ac-table tbody tr.row-selected { background: #eaf2fc; }
.mono-cell { font-family: 'DejaVu Sans Mono', monospace; font-size: 10px; color: var(--text-secondary); }

.detail-panel { background: var(--page-plane); border-radius: 8px; padding: 12px 14px; }
.detail-empty { background: var(--page-plane); border-radius: 8px; padding: 24px; text-align: center; color: var(--muted-ink); font-size: 11.5px; }
.detail-id { font-family: 'DejaVu Sans Mono', monospace; font-size: 11px; color: var(--text-secondary); }
.detail-sub-title { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); margin-bottom: 6px; }

/* ---------- 쿠폰함 ---------- */
.coupon-card {
  border-radius: 12px; padding: 14px 16px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--series-1), #1c5cab);
}
.coupon-card.tier-low { background: linear-gradient(135deg, var(--series-3), #0c8a5e); }
.coupon-card .coupon-badge { font-size: 9.5px; font-weight: 800; background: rgba(255,255,255,0.22); padding: 2px 8px; border-radius: 10px; display: inline-block; }
.coupon-card .coupon-title { font-size: 16px; font-weight: 800; margin: 8px 0 2px; }
.coupon-card .coupon-desc { font-size: 11px; opacity: 0.92; }
.coupon-card .coupon-code {
  margin-top: 10px; font-family: 'DejaVu Sans Mono', monospace; font-size: 12px; font-weight: 700;
  background: rgba(255,255,255,0.16); border: 1px dashed rgba(255,255,255,0.5); border-radius: 7px;
  padding: 6px 10px; display: flex; justify-content: space-between; align-items: center;
}
.coupon-expire { font-size: 9.5px; margin-top: 8px; opacity: 0.85; }
.coupon-list-mini { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.coupon-mini-row { display: flex; justify-content: space-between; align-items: center; background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 8px; padding: 8px 10px; font-size: 11px; }

/* ---------- 취향 기반 추천 ---------- */
.taste-tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.taste-tag { font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 12px; background: #ece9fb; color: #4a3d99; }
.taste-tag .pct { opacity: 0.7; font-weight: 600; margin-left: 3px; }
.taste-track { display: flex; align-items: center; gap: 10px; background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 8px; padding: 8px 10px; margin-top: 7px; }
.taste-track .cover { width: 30px; height: 30px; border-radius: 6px; background: var(--series-1); flex: 0 0 30px; display:flex; align-items:center; justify-content:center; color:#fff; font-size: 13px; }
.taste-track .meta { flex: 1; }
.taste-track .meta b { display: block; font-size: 11.5px; }
.taste-track .meta span { font-size: 9.5px; color: var(--muted-ink); }
.match-badge { font-size: 9px; font-weight: 800; color: var(--success-text); background: #e6f6e6; padding: 2px 7px; border-radius: 8px; }

/* ---------- LTV 우선순위 리스트 ---------- */
.priority-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; }
.priority-table th { text-align: left; padding: 6px 8px; font-size: 9.5px; color: var(--muted-ink); border-bottom: 1px solid var(--gridline); }
.priority-table td { padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
.priority-rank { font-weight: 800; color: var(--series-2); }

/* ---------- 고객군 캠페인 ---------- */
.campaign-builder { display: flex; flex-direction: column; gap: 14px; }
.campaign-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.campaign-step { background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 9px; padding: 9px 10px; }
.campaign-step b { display: block; font-size: 10.5px; margin-bottom: 3px; }
.campaign-step span { font-size: 9.5px; color: var(--muted-ink); }
.campaign-form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.campaign-form-grid .field-group { margin-bottom: 0; }
.campaign-preview { background: var(--page-plane); border: 1px solid var(--gridline); border-radius: 10px; padding: 12px; }
.campaign-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.campaign-preview-item { background: #fff; border: 1px solid var(--gridline); border-radius: 8px; padding: 9px; }
.campaign-preview-label { font-size: 9.5px; color: var(--muted-ink); }
.campaign-preview-value { font-size: 17px; font-weight: 800; margin-top: 3px; }
.campaign-confirm { display: flex; align-items: flex-start; gap: 7px; font-size: 11px; color: var(--text-secondary); }
.campaign-confirm input { margin-top: 2px; }
.campaign-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
.campaign-warning { background: #fff3d6; color: #795200; border: 1px solid #efd895; border-radius: 8px; padding: 8px 10px; font-size: 11px; }
.campaign-success { background: #eaf8ee; color: #076628; border: 1px solid #bfe4c9; border-radius: 8px; padding: 10px 12px; font-size: 11.5px; }
.campaign-sample-wrap { max-height: 220px; overflow-y: auto; border: 1px solid var(--gridline); border-radius: 8px; }
.campaign-sample-wrap .priority-table { margin-top: 0; }
.campaign-draft-panel {
  border: 1px solid #bed6f2; border-radius: 11px; padding: 13px 14px;
  background: linear-gradient(135deg, #f5f9fe, #edf5fd);
}
.campaign-draft-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.campaign-draft-title { font-size: 12px; font-weight: 800; color: #164f8e; }
.campaign-draft-list { display: flex; flex-wrap: wrap; gap: 7px; }
.campaign-draft-customer {
  display: inline-flex; align-items: center; gap: 7px; max-width: 100%;
  border: 1px solid #d4e3f5; border-radius: 999px; padding: 5px 7px 5px 10px;
  background: #fff; color: var(--text-secondary); font-size: 9.5px;
}
.campaign-draft-customer .mono-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.campaign-draft-remove { border: 0; width: 20px; height: 20px; border-radius: 50%; background: #edf3fa; color: #57718e; cursor: pointer; }
.campaign-draft-remove:hover { background: #dce9f7; color: #174e89; }
.draft-add-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.draft-added-note { color: #087044; font-size: 10.5px; font-weight: 700; }

/* ---------- 관리자 정보 구조 ---------- */
.admin-shell { display: flex; flex-direction: column; min-height: 100vh; }
.admin-sidebar {
  position: sticky; top: 0; z-index: 20; padding: 14px 28px 0;
  background:
    radial-gradient(circle at 14% -80%, rgba(235, 104, 52, 0.22), transparent 36%),
    linear-gradient(110deg, #111419 0%, #181d24 58%, #101318 100%);
  color: #f5f6f7;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "brand spacer meta"
    "nav nav nav";
  align-items: center;
  column-gap: 24px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 24px rgba(14, 18, 24, 0.14);
}
.sidebar-brand { grid-area: brand; display: flex; align-items: center; gap: 11px; min-width: 190px; }
.sidebar-brand .brand-mark {
  width: 38px; height: 38px; border-radius: 12px;
  background: linear-gradient(145deg, #f47a45, var(--series-2));
  box-shadow: 0 7px 18px rgba(235,104,52,0.28);
}
.sidebar-brand-title { font-size: 14px; font-weight: 850; letter-spacing: 0.01em; }
.sidebar-brand-sub { margin-top: 2px; color: #9fa9b5; font-size: 9.5px; }
.sidebar-label { display: none; }
.sidebar-nav {
  grid-area: nav;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  min-width: 0;
  margin-top: 13px;
}
.sidebar-nav-btn {
  position: relative;
  min-width: 0;
  min-height: 52px;
  border: 1px solid rgba(255,255,255,0.07);
  border-bottom: 0;
  border-radius: 11px 11px 0 0;
  padding: 9px 13px 10px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 3px;
  text-align: left;
  background: rgba(255,255,255,0.025);
  color: #ccd3db;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, transform 160ms ease, border-color 160ms ease;
}
.sidebar-nav-btn::after {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: transparent;
}
.sidebar-nav-btn:hover {
  background: rgba(255,255,255,0.075);
  border-color: rgba(255,255,255,0.13);
  color: #fff;
  transform: translateY(-1px);
}
.sidebar-nav-btn.sidebar-nav-active {
  background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.07));
  border-color: rgba(255,255,255,0.17);
  color: #fff;
  box-shadow: 0 -7px 20px rgba(0,0,0,0.12);
}
.sidebar-nav-btn.sidebar-nav-active::after { background: var(--series-2); }
.sidebar-nav-label { width: 100%; font-size: 11.5px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-nav-hint { width: 100%; color: #8f99a5; font-size: 8.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-nav-btn:hover .sidebar-nav-hint,
.sidebar-nav-btn.sidebar-nav-active .sidebar-nav-hint { color: #b7c0ca; }
.sidebar-meta {
  grid-area: meta;
  position: relative;
  padding: 7px 12px 7px 28px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  background: rgba(255,255,255,0.035);
  color: #a7b0bb;
  font-size: 8.8px;
  line-height: 1.45;
  text-align: left;
}
.sidebar-meta::before {
  content: "";
  position: absolute;
  left: 12px;
  top: 13px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #39c98a;
  box-shadow: 0 0 0 4px rgba(57,201,138,0.12);
}
.admin-workspace { min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.admin-topbar {
  position: relative; z-index: 10; min-height: 74px; padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: rgba(252,252,251,0.96); border-bottom: 1px solid var(--border-hairline);
}
.page-title { margin: 0; font-size: 18px; font-weight: 850; letter-spacing: -0.015em; }
.page-subtitle { margin-top: 4px; color: var(--muted-ink); font-size: 10.5px; }
.admin-user-row { display: flex; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 10.5px; }
.admin-draft-btn {
  border: 1px solid #cbdcf0; border-radius: 999px; padding: 7px 11px;
  background: #edf5fd; color: #174f8d; font-size: 10.5px; font-weight: 800; cursor: pointer;
}
.admin-draft-btn:hover { background: #dfeefa; border-color: #a9c7e8; }
.admin-page-content { flex: 1; padding: 24px 28px 40px; max-width: 1380px; width: 100%; margin: 0 auto; }
.priority-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
.priority-card { border: 1px solid var(--gridline); background: var(--surface-1); border-radius: 10px; padding: 14px; }
.priority-card-head { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; }
.priority-card-title { font-size: 11.5px; font-weight: 800; }
.priority-card-value { font-size: 21px; font-weight: 800; }
.priority-card-copy { min-height: 32px; margin: 5px 0 10px; color: var(--text-secondary); font-size: 10px; }
.insight-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 18px; }
.insight-card { border: 1px solid var(--gridline); border-radius: 10px; background: var(--surface-1); padding: 14px; }
.insight-card-title { font-size: 11.5px; font-weight: 800; margin-bottom: 6px; }
.insight-card-body { color: var(--text-secondary); font-size: 10.5px; line-height: 1.55; }
.evidence-tag { display: inline-block; margin-bottom: 7px; border-radius: 999px; padding: 2px 7px; background: #e9f1fb; color: #1c5cab; font-size: 9px; font-weight: 800; }
.evidence-tag.offline { background: #f2ecfb; color: #5c3ca5; }
.model-metric-note { margin-top: 8px; color: var(--muted-ink); font-size: 9.5px; }
.page-action-row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
.governance-list { display: grid; gap: 8px; }
.governance-item { padding: 10px 12px; border-left: 3px solid var(--baseline); background: var(--page-plane); font-size: 10.5px; }
.governance-item b { display: block; margin-bottom: 3px; }
.governance-item span { color: var(--text-secondary); }

@media (max-width: 900px) {
  .admin-sidebar { padding: 11px 14px 0; column-gap: 12px; }
  .sidebar-brand-sub, .sidebar-meta { display: none; }
  .sidebar-nav { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: thin; }
  .sidebar-nav-btn { flex: 0 0 142px; min-height: 48px; padding: 8px 10px 9px; }
  .sidebar-nav-hint { display: none; }
  .campaign-steps, .campaign-form-grid, .campaign-preview-grid { grid-template-columns: 1fr 1fr; }
  .priority-grid, .insight-grid { grid-template-columns: 1fr; }
  .ac-body { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .campaign-steps, .campaign-form-grid, .campaign-preview-grid, .kpi-row, .grid-2 { grid-template-columns: 1fr; }
  .sidebar-brand-title { display: none; }
  .sidebar-brand { gap: 0; }
  .sidebar-brand { min-width: auto; }
  .sidebar-nav { padding-bottom: 0; }
  .sidebar-nav-btn { flex-basis: 112px; align-items: center; text-align: center; }
  .admin-page-content { padding: 16px; }
  .admin-topbar { padding: 12px 16px; }
  .admin-user-row span { display: none; }
}

/* ---------- 로그인 / 회원가입 화면 ---------- */
.login-shell {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--page-plane); padding: 20px;
}
.login-card {
  width: 100%; max-width: 380px; background: var(--surface-1); border: 1px solid var(--border-hairline);
  border-radius: 16px; padding: 28px 26px; box-shadow: 0 8px 28px rgba(0,0,0,0.06);
}
.login-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.login-title { font-weight: 700; font-size: 15px; }
.login-sub { font-size: 11.5px; color: var(--muted-ink); margin-top: 2px; }

.mode-toggle { display: flex; gap: 4px; background: var(--page-plane); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.mode-btn {
  flex: 1; border: none; background: transparent; padding: 9px 0; border-radius: 8px; font-size: 12.5px;
  font-weight: 700; color: var(--text-secondary); cursor: pointer; text-align: center;
}
.mode-btn.mode-active { background: var(--series-1); color: #fff; }

.form-tab-row { display: flex; gap: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border-hairline); }
.form-tab { border: none; background: none; padding: 0 0 9px 0; font-size: 12.5px; font-weight: 700; color: var(--muted-ink); cursor: pointer; border-bottom: 2px solid transparent; }
.form-tab.form-tab-active { color: var(--series-1); border-bottom-color: var(--series-1); }

.field-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.field-label { font-size: 10.5px; font-weight: 700; color: var(--muted-ink); }
.text-input {
  border: 1px solid var(--border-hairline); border-radius: 8px; padding: 9px 11px; font-size: 12.5px;
  background: #fff; color: var(--text-primary); width: 100%;
}
.text-input:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }

.login-submit { width: 100%; padding: 10px 0; font-size: 12.8px; margin-top: 4px; }
.login-error {
  background: #fdecea; border: 1px solid #f3c6c1; color: #a8291a; font-size: 11.5px;
  border-radius: 8px; padding: 8px 11px; margin-bottom: 13px;
}

.msno-sample-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; margin-bottom: 14px; }
.msno-sample-btn {
  text-align: left; border: 1px solid var(--border-hairline); background: #fff; border-radius: 8px;
  padding: 9px 11px; font-size: 11.5px; cursor: pointer; color: var(--text-primary);
}
.msno-sample-btn:hover { border-color: var(--series-1); }
.msno-sample-btn b { display: block; font-size: 10px; color: var(--series-1); margin-bottom: 2px; }
.msno-sample-code { font-family: 'DejaVu Sans Mono', monospace; font-size: 9.5px; color: var(--muted-ink); word-break: break-all; }

.logout-btn {
  border: 1px solid var(--border-hairline); background: #fff; color: var(--text-secondary);
  border-radius: 7px; padding: 7px 13px; font-size: 11.5px; font-weight: 700; cursor: pointer;
}

</style>

<script>
const html = htm.bind(React.createElement);
const { useState, useMemo, useEffect } = React;

// FastAPI 백엔드 주소. `uvicorn app.main:app --reload --port 8000` 로 backend/ 폴더에서 실행해두면 됩니다.
const API_BASE = window.location.origin;

/* ============================== 실제 데이터 (관리자 API에서 실시간 조회) ============================== */
// 아래 mock 상수들은 전부 제거하고, AdminTab이 /admin/kpis + /admin/customers를 실시간으로
// 불러와 화면을 채운다. (예전엔 여기 하드코딩된 값이 있었는데, 실DB 연동으로 교체함)

// 화면에는 "고월매출/저월매출"로 보여준다 — 실제 분류 기준이 LTV가 아니라 고객별
// 월평균 결제액의 중앙값이기 때문. DB 값(segment/risk_tier/ltv_tier)은 "고가치/저가치"
// 그대로 유지하고, 표시 문구만 이 함수로 바꾼다.
function displaySegment(segment) {
  if (!segment) return segment;
  return segment.replace("고가치", "고월매출").replace("저가치", "저월매출");
}

const LTV_SEGMENT_META = [
  { key: "고위험/고가치", label: "고위험 × 고월매출", status: "critical" },
  { key: "고위험/저가치", label: "고위험 × 저월매출", status: "warning" },
  { key: "저위험/고가치", label: "저위험 × 고월매출", status: "good" },
  { key: "저위험/저가치", label: "저위험 × 저월매출", status: "muted" },
];

// 생애주기 상태 필터 옵션 — Retention/긴급 갱신/Win-back 대상을 명시적으로 구분해서 고른다.
const LIFECYCLE_FILTER_META = [
  { key: "구독활성", label: "Retention 대상 (구독활성)" },
  { key: "갱신유예기간", label: "긴급 갱신 대상 (갱신유예기간)" },
  { key: "장기만료", label: "Win-back 대상 (장기만료)" },
];

const ACTION_TYPE_LABELS = { reminder: "리마인드", discount_offer: "할인 오퍼" };

// KKBOX 결제 데이터는 대만달러(New Taiwan Dollar) 기준이라 ₩(원)이 아니라 NT$로 표기한다.
function fmtNTD(amount) {
  return amount != null ? `NT$${Math.round(amount).toLocaleString()}` : "-";
}

// 이 서빙 데이터 전체가 언제 시점 스냅샷인지 — D-day/최근 결제일이 "오늘" 기준 실시간이
// 아니라는 걸 화면 어디서든 바로 알 수 있도록 문구로 명시.
const DATA_OBSERVED_AT = "2017-01-31 관측 기준";

function fmtSentAt(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

// lifecycle_status(구독활성/갱신유예기간/장기만료/상태확인필요)를 days_to_expire와 함께
// 사람이 읽기 좋은 문구 + 칩 색상으로 변환. days_to_expire 원본은 그대로 실데이터.
// 이 함수 하나로 화면 전체(액션센터 목록/고객 상세 등)의 D-day 표기를 통일한다.
function formatLifecycle(status, daysToExpire) {
  if (status === "구독활성") {
    if (daysToExpire === 0) return { text: "오늘 만료", cls: "chip-warning" };
    return { text: `만료까지 D-${daysToExpire ?? "-"}`, cls: "chip-accent" };
  }
  if (status === "갱신유예기간") {
    const d = daysToExpire != null ? Math.abs(daysToExpire) : "-";
    return { text: `만료 후 ${d}일 · 갱신 유예기간`, cls: "chip-warning" };
  }
  if (status === "장기만료") {
    return { text: "장기 만료 · Win-back 대상", cls: "chip-critical" };
  }
  if (status === "상태확인필요") {
    return { text: "상태 확인 필요", cls: "" };
  }
  return { text: daysToExpire != null ? `만료 D-${daysToExpire}` : "-", cls: "" };
}

// 생애주기 상태 + 위험도/월매출에 따라 "추천 액션" 버튼 문구를 다르게 보여준다.
// 실제 DB 액션 유형은 reminder/discount_offer 2개뿐이라, 그 2개 버튼의 "표시 문구"만
// 상황에 맞게 바꾸고 실제로 보내는 action_type은 그대로 reminder/discount_offer를 쓴다.
function getActionLabels(customer) {
  const status = customer.lifecycle_status;
  if (status === "장기만료") {
    return { reminder: "신규 콘텐츠 복귀 안내 발송", discount_offer: "복귀 할인 오퍼 발송" };
  }
  if (status === "갱신유예기간") {
    return { reminder: "긴급 갱신 안내 발송", discount_offer: "기간 한정 할인 발송" };
  }
  if (status === "구독활성" && customer.risk_tier === "고위험") {
    return { reminder: "갱신 리마인드 발송", discount_offer: "할인 오퍼 발송" };
  }
  if (status === "구독활성" && customer.risk_tier === "저위험" && customer.ltv_tier === "고가치") {
    return { reminder: "VIP 감사 메시지 발송", discount_offer: "VIP 감사 혜택 발송" };
  }
  if (status === "구독활성" && customer.risk_tier === "저위험" && customer.ltv_tier === "저가치") {
    return { reminder: "콘텐츠 추천 안내 발송", discount_offer: "할인 오퍼 발송" };
  }
  return { reminder: "리마인드 발송", discount_offer: "할인 오퍼 발송" };
}

// retention_cohort 테이블은 (cohort_month, month_offset)별로 여러 코호트를 담고 있을 수 있어서,
// 화면에는 가장 최신 cohort_month 하나만 골라 M0(가입월)~M.. 순서로 정렬해 꺾은선으로 보여준다.
function buildRetentionPoints(rows) {
  if (!rows || !rows.length) return [];
  const latestCohort = rows.reduce((max, r) => (r.cohort_month > max ? r.cohort_month : max), rows[0].cohort_month);
  return rows
    .filter((r) => r.cohort_month === latestCohort)
    .sort((a, b) => a.month_offset - b.month_offset)
    .map((r) => ({ m: r.month_offset === 0 ? "가입월" : `M${r.month_offset}`, pct: Number(r.pct), observed: true }));
}

/* ============================== 차트 컴포넌트 (dataviz 팔레트 기반) ============================== */

function HBarChart({ data, valueKey, labelKey, subLabelKey, colorKey, maxOverride, unit, height = 26 }) {
  const max = maxOverride || Math.max(...data.map((d) => d[valueKey]));
  return html`
    <div class="hbar-chart">
      ${data.map(
        (d, i) => html`
          <div class="hbar-row" key=${i}>
            <div class="hbar-label">
              <span class="hbar-label-main">${d[labelKey]}</span>
              ${subLabelKey ? html`<span class="hbar-label-sub">${d[subLabelKey]}</span>` : null}
            </div>
            <div class="hbar-track" style=${{ height: `${height}px` }}>
              <div
                class="hbar-fill"
                style=${{
                  width: `${Math.max(2, (d[valueKey] / max) * 100)}%`,
                  background: colorKey ? d[colorKey] : "var(--series-1)",
                }}
              ></div>
            </div>
            <div class="hbar-value">${typeof d[valueKey] === "number" ? d[valueKey].toLocaleString() : d[valueKey]}${unit || ""}</div>
          </div>
        `
      )}
    </div>
  `;
}

function StatTile({ label, value, sub, status }) {
  return html`
    <div class="stat-tile ${status ? `stat-${status}` : ""}">
      <div class="stat-label">${label}</div>
      <div class="stat-value">${value}</div>
      ${sub ? html`<div class="stat-sub">${sub}</div>` : null}
    </div>
  `;
}

function RetentionLine({ points }) {
  const pts = points || [];
  if (!pts.length) {
    return html`<p class="small-muted">리텐션 코호트 데이터가 아직 없어요.</p>`;
  }
  const w = 560,
    h = 170,
    padL = 40,
    padR = 20,
    padT = 20,
    padB = 30;
  const innerW = w - padL - padR,
    innerH = h - padT - padB;
  const x = (i) => padL + (i / Math.max(1, pts.length - 1)) * innerW;
  const y = (pct) => padT + innerH - (pct / 100) * innerH;
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"} ${x(i)} ${y(p.pct)}`).join(" ");
  return html`
    <svg viewBox="0 0 ${w} ${h}" class="line-chart" role="img" aria-label="코호트 리텐션 곡선">
      ${[0, 25, 50, 75, 100].map(
        (g) => html`
          <line x1=${padL} x2=${w - padR} y1=${y(g)} y2=${y(g)} class="gridline" key=${g} />
          <text x=${padL - 8} y=${y(g) + 3} class="axis-label" text-anchor="end">${g}%</text>
        `
      )}
      <path d=${path} class="line-mark" fill="none" />
      ${pts.map(
        (p, i) => html`
          <g key=${i}>
            <circle cx=${x(i)} cy=${y(p.pct)} r="5" class="line-dot" />
            <text x=${x(i)} y=${y(p.pct) - 12} class="point-label" text-anchor="middle">${p.pct}%</text>
            <text x=${x(i)} y=${h - 8} class="axis-label" text-anchor="middle">${p.m}</text>
          </g>
        `
      )}
    </svg>
  `;
}

/* ============================== 운영 대시보드 (액션센터) ============================== */

function CustomerDetail({ customer, draftCustomers, onAddToDraft, onOpenCampaign }) {
  const [copied, setCopied] = useState(false);

  if (!customer) {
    return html`<div class="detail-empty">왼쪽 목록에서 고객을 선택하면 상세 정보가 표시됩니다.</div>`;
  }

  function copyMsno() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(customer.msno).then(() => {
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      });
    }
  }

  const actionLabels = getActionLabels(customer);
  const isInDraft = draftCustomers.some((item) => item.msno === customer.msno);

  return html`
    <div class="detail-panel">
      <div class="detail-id">${customer.msno}</div>
      <div class="row gap8" style=${{ margin: "6px 0 12px 0", flexWrap: "wrap" }}>
        <span class="chip ${customer.risk_tier === "고위험" ? "chip-critical" : "chip-warning"}">위험도 ${customer.churn_proba.toFixed(3)}</span>
        <span class="chip">${displaySegment(customer.segment)}</span>
      </div>
      <div class="detail-sub-title">고객 요약</div>
      <div class="row gap8" style=${{ flexWrap: "wrap", marginBottom: "6px" }}>
        <span class="chip chip-accent">월평균 결제액 ${fmtNTD(customer.avg_monthly_revenue)}</span>
        <span class="chip chip-accent">근사 LTV ${fmtNTD(customer.ltv_approx)}</span>
        <span class="chip ${formatLifecycle(customer.lifecycle_status, customer.days_to_expire).cls}">${formatLifecycle(customer.lifecycle_status, customer.days_to_expire).text}</span>
        <span class="chip">마지막 결제 ${customer.days_since_last_txn ?? "-"}일 전</span>
      </div>
      <div class="detail-sub-title">추천 액션</div>
      <div class="row gap8" style=${{ flexWrap: "wrap" }}>
        <span class="chip chip-good">${actionLabels.reminder}</span>
        <span class="chip chip-accent">${actionLabels.discount_offer}</span>
      </div>
      <div class="draft-add-row">
        <button type="button" class="btn btn-primary btn-sm" disabled=${isInDraft || draftCustomers.length >= 500} onClick=${() => onAddToDraft(customer)}>
          ${isInDraft ? "✓ 캠페인 초안에 추가됨" : draftCustomers.length >= 500 ? "초안 최대 500명" : "캠페인 초안에 추가"}
        </button>
        <button type="button" class="btn btn-ghost btn-sm" onClick=${copyMsno}>${copied ? "고객 ID 복사됨" : "고객 ID 복사"}</button>
        ${draftCustomers.length
          ? html`<button type="button" class="btn btn-ghost btn-sm" onClick=${onOpenCampaign}>초안 보기 (${draftCustomers.length}명)</button>`
          : null}
      </div>
      <p class="small-muted" style=${{ margin: "8px 0 0" }}>발송은 캠페인 실행 화면에서 대상 검토와 제외 조건 확인 후 진행합니다.</p>
    </div>
  `;
}

const AC_PAGE_SIZE = 50;

const CAMPAIGN_PURPOSES = {
  retention: { label: "Retention", lifecycle: "구독활성", description: "구독 중인 고객의 이탈 예방" },
  renewal: { label: "긴급 갱신", lifecycle: "갱신유예기간", description: "만료 후 30일 이내 재구독 지원" },
  winback: { label: "Win-back", lifecycle: "장기만료", description: "장기만료 고객의 복귀 유도" },
};

function CampaignCenter({ auth, onCompleted, draftCustomers, onRemoveDraft, onClearDraft }) {
  const [purpose, setPurpose] = useState("retention");
  const [riskTier, setRiskTier] = useState("고위험");
  const [segment, setSegment] = useState("고위험/고가치");
  const [actionType, setActionType] = useState("reminder");
  const [selectionMode, setSelectionMode] = useState(draftCustomers.length ? "manual" : "all_matching");
  const [audienceLimit, setAudienceLimit] = useState(5000);
  const [excludeRecentDays, setExcludeRecentDays] = useState(7);
  const [campaignName, setCampaignName] = useState("구독활성 고위험·고월매출 리마인드");
  const [preview, setPreview] = useState(null);
  const [confirmed, setConfirmed] = useState(false);
  const [loading, setLoading] = useState(false);
  const [launching, setLaunching] = useState(false);
  const [error, setError] = useState("");
  const [result, setResult] = useState(null);
  const draftCustomerKey = draftCustomers.map((customer) => customer.msno).join("|");

  function invalidate() {
    setPreview(null);
    setConfirmed(false);
    setResult(null);
    setError("");
  }

  useEffect(() => {
    setPreview(null);
    setConfirmed(false);
    setResult(null);
    if (selectionMode === "manual" && draftCustomers.length === 0) {
      setSelectionMode("all_matching");
    }
  }, [draftCustomerKey]);

  function changePurpose(value) {
    setPurpose(value);
    const meta = CAMPAIGN_PURPOSES[value];
    setCampaignName(`${meta.lifecycle} 고객군 ${ACTION_TYPE_LABELS[actionType]}`);
    invalidate();
  }

  function changeActionType(value) {
    setActionType(value);
    setCampaignName(`${CAMPAIGN_PURPOSES[purpose].lifecycle} 고객군 ${ACTION_TYPE_LABELS[value]}`);
    invalidate();
  }

  function buildPreviewParams() {
    const params = new URLSearchParams({
      purpose,
      action_type: actionType,
      selection_mode: selectionMode,
      exclude_recent_days: String(excludeRecentDays),
      sort_by: "churn_proba",
    });
    if (riskTier !== "all") params.set("risk_tier", riskTier);
    if (segment !== "all") params.set("segment", segment);
    if (selectionMode === "top_n") params.set("audience_limit", String(audienceLimit));
    return params;
  }

  function buildAudienceBody() {
    return {
      purpose,
      action_type: actionType,
      risk_tier: selectionMode === "manual" || riskTier === "all" ? null : riskTier,
      segment: selectionMode === "manual" || segment === "all" ? null : segment,
      selection_mode: selectionMode,
      audience_limit: selectionMode === "top_n" ? Number(audienceLimit) : null,
      exclude_recent_days: Number(excludeRecentDays),
      manual_msnos: selectionMode === "manual" ? draftCustomers.map((customer) => customer.msno) : [],
    };
  }

  async function previewAudience() {
    setLoading(true);
    setError("");
    setResult(null);
    setConfirmed(false);
    try {
      const manualSelection = selectionMode === "manual";
      const res = await fetch(
        manualSelection
          ? `${API_BASE}/admin/campaigns/preview`
          : `${API_BASE}/admin/campaigns/preview?${buildPreviewParams().toString()}`,
        manualSelection
          ? {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: `Bearer ${auth.token}` },
              body: JSON.stringify(buildAudienceBody()),
            }
          : { headers: { Authorization: `Bearer ${auth.token}` } }
      );
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `대상 미리보기 실패 (${res.status})`);
      setPreview(data);
    } catch (err) {
      setError(err.message);
      setPreview(null);
    } finally {
      setLoading(false);
    }
  }

  async function launchCampaign() {
    if (!preview || !preview.launchable || !confirmed) return;
    setLaunching(true);
    setError("");
    setResult(null);
    const requestKey = window.crypto && window.crypto.randomUUID
      ? window.crypto.randomUUID()
      : `campaign-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    try {
      const res = await fetch(`${API_BASE}/admin/campaigns`, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: `Bearer ${auth.token}` },
        body: JSON.stringify({
          request_key: requestKey,
          name: campaignName.trim(),
          ...buildAudienceBody(),
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail || `캠페인 실행 실패 (${res.status})`);
      setResult(data);
      setConfirmed(false);
      if (selectionMode === "manual") onClearDraft();
      if (onCompleted) onCompleted();
    } catch (err) {
      setError(err.message);
    } finally {
      setLaunching(false);
    }
  }

  return html`
    <div class="campaign-builder">
      <p class="section-intro" style=${{ margin: 0 }}>
        고객군 조건 또는 고객 탐색에서 직접 추가한 초안을 대상으로 캠페인을 실행합니다.
        실행 전에 대상과 최근 동일 액션 제외 결과를 반드시 검토합니다.
      </p>

      <div class="campaign-steps">
        <div class="campaign-step"><b>1. 목적</b><span>Retention·긴급 갱신·Win-back 분리</span></div>
        <div class="campaign-step"><b>2. 대상</b><span>위험도·월매출·전체/상위 N명</span></div>
        <div class="campaign-step"><b>3. 제외</b><span>최근 동일 액션 고객 자동 제외</span></div>
        <div class="campaign-step"><b>4. 검토·실행</b><span>대상 수와 샘플 확인 후 일괄 기록</span></div>
      </div>

      ${draftCustomers.length
        ? html`
            <div class="campaign-draft-panel">
              <div class="campaign-draft-head">
                <div><div class="campaign-draft-title">고객 탐색에서 추가한 캠페인 초안 · ${draftCustomers.length}명</div><div class="small-muted">목적과 생명주기가 맞지 않거나 최근 동일 액션을 받은 고객은 미리보기에서 제외됩니다.</div></div>
                <button type="button" class="btn btn-ghost btn-sm" onClick=${onClearDraft}>초안 비우기</button>
              </div>
              <div class="campaign-draft-list">
                ${draftCustomers.slice(0, 30).map((customer) => html`
                  <span key=${customer.msno} class="campaign-draft-customer">
                    <span class="mono-cell">${customer.msno}</span>
                    <span>${customer.lifecycle_status || "상태 미확인"}</span>
                    <button type="button" class="campaign-draft-remove" aria-label="${customer.msno} 제거" title="초안에서 제거" onClick=${() => onRemoveDraft(customer.msno)}>×</button>
                  </span>
                `)}
                ${draftCustomers.length > 30 ? html`<span class="small-muted">외 ${draftCustomers.length - 30}명</span>` : null}
              </div>
            </div>
          `
        : null}

      <div class="campaign-form-grid">
        <div class="field-group">
          <label class="field-label">캠페인 목적</label>
          <select class="select" value=${purpose} onChange=${(e) => changePurpose(e.target.value)}>
            ${Object.entries(CAMPAIGN_PURPOSES).map(([key, meta]) => html`<option key=${key} value=${key}>${meta.label} · ${meta.lifecycle}</option>`)}
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">위험도</label>
          <select class="select" disabled=${selectionMode === "manual"} value=${riskTier} onChange=${(e) => { setRiskTier(e.target.value); invalidate(); }}>
            <option value="all">전체</option><option value="고위험">고위험</option><option value="저위험">저위험</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">월매출 세그먼트</label>
          <select class="select" disabled=${selectionMode === "manual"} value=${segment} onChange=${(e) => { setSegment(e.target.value); invalidate(); }}>
            <option value="all">전체</option>
            <option value="고위험/고가치">고위험/고월매출</option>
            <option value="고위험/저가치">고위험/저월매출</option>
            <option value="저위험/고가치">저위험/고월매출</option>
            <option value="저위험/저가치">저위험/저월매출</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">액션</label>
          <select class="select" value=${actionType} onChange=${(e) => changeActionType(e.target.value)}>
            <option value="reminder">리마인드</option><option value="discount_offer">할인 오퍼</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">대상 선택</label>
          <select class="select" value=${selectionMode} onChange=${(e) => { setSelectionMode(e.target.value); invalidate(); }}>
            <option value="all_matching">조건 충족 고객 전체</option>
            <option value="top_n">위험도 상위 N명</option>
            <option value="manual" disabled=${draftCustomers.length === 0}>직접 추가 고객 (${draftCustomers.length}명)</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">상위 N명</label>
          <input class="text-input" type="number" min="1" max="50000" disabled=${selectionMode !== "top_n"} value=${audienceLimit} onChange=${(e) => { setAudienceLimit(Number(e.target.value)); invalidate(); }} />
        </div>
        <div class="field-group">
          <label class="field-label">동일 액션 제외 기간</label>
          <select class="select" value=${excludeRecentDays} onChange=${(e) => { setExcludeRecentDays(Number(e.target.value)); invalidate(); }}>
            <option value=${0}>제외 안 함</option><option value=${7}>최근 7일</option><option value=${14}>최근 14일</option><option value=${30}>최근 30일</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">캠페인 이름</label>
          <input class="text-input" value=${campaignName} maxlength="120" onInput=${(e) => { setCampaignName(e.target.value); setResult(null); }} />
        </div>
      </div>

      <div class="campaign-actions">
        <span class="small-muted">${CAMPAIGN_PURPOSES[purpose].description} · 최근 동일 액션 고객 자동 제외</span>
        <button type="button" class="btn btn-ghost" disabled=${loading || launching} onClick=${previewAudience}>
          ${loading ? "계산 중..." : "대상 미리보기"}
        </button>
      </div>

      ${error ? html`<div class="login-error" style=${{ margin: 0 }}>${error}</div>` : null}
      ${preview
        ? html`
            <div class="campaign-preview">
              <div class="campaign-preview-grid">
                <div class="campaign-preview-item"><div class="campaign-preview-label">${selectionMode === "manual" ? "초안 고객" : "조건 충족"}</div><div class="campaign-preview-value">${(selectionMode === "manual" ? preview.requested_count : preview.matched_count).toLocaleString()}</div></div>
                <div class="campaign-preview-item"><div class="campaign-preview-label">${selectionMode === "manual" ? "목적·상태 불일치" : "최근 동일 액션 제외"}</div><div class="campaign-preview-value">${(selectionMode === "manual" ? preview.excluded_condition_count : preview.excluded_recent_count).toLocaleString()}</div></div>
                <div class="campaign-preview-item"><div class="campaign-preview-label">${selectionMode === "manual" ? "최근 동일 액션 제외" : "발송 가능"}</div><div class="campaign-preview-value">${(selectionMode === "manual" ? preview.excluded_recent_count : preview.eligible_count).toLocaleString()}</div></div>
                <div class="campaign-preview-item"><div class="campaign-preview-label">최종 선택</div><div class="campaign-preview-value">${preview.selected_count.toLocaleString()}</div></div>
              </div>
              ${preview.warning ? html`<div class="campaign-warning">${preview.warning}</div>` : null}
              ${(preview.sample || []).length
                ? html`
                    <div class="detail-sub-title" style=${{ marginTop: "10px" }}>발송 대상 샘플 10명</div>
                    <div class="campaign-sample-wrap">
                      <table class="priority-table">
                        <thead><tr><th>고객 ID</th><th>위험도</th><th>월매출</th><th>구독 상태</th></tr></thead>
                        <tbody>${preview.sample.map((c) => html`
                          <tr key=${c.msno}><td class="mono-cell">${c.msno}</td><td>${Number(c.churn_proba).toFixed(3)}</td><td>${displaySegment(c.segment)}</td><td>${formatLifecycle(c.lifecycle_status, c.days_to_expire).text}</td></tr>
                        `)}</tbody>
                      </table>
                    </div>
                  `
                : null}
              <label class="campaign-confirm" style=${{ marginTop: "11px" }}>
                <input type="checkbox" checked=${confirmed} disabled=${!preview.launchable || launching} onChange=${(e) => setConfirmed(e.target.checked)} />
                <span>최종 ${preview.selected_count.toLocaleString()}명에게 캠페인을 실행하는 것을 확인했습니다.</span>
              </label>
              <div class="campaign-actions" style=${{ marginTop: "10px" }}>
                <button type="button" class="btn btn-primary" disabled=${!confirmed || !preview.launchable || launching || !campaignName.trim()} onClick=${launchCampaign}>
                  ${launching ? "일괄 기록 중..." : `${preview.selected_count.toLocaleString()}명 캠페인 실행`}
                </button>
              </div>
            </div>
          `
        : null}
      ${result
        ? html`<div class="campaign-success"><b>${result.name}</b> 캠페인 #${result.id} 완료 · ${Number(result.recipient_count).toLocaleString()}명에게 ${ACTION_TYPE_LABELS[result.action_type]} 발송 기록을 생성했습니다.</div>`
        : null}
    </div>
  `;
}

function ActionCenter({ auth, draftCustomers, onAddToDraft, onOpenCampaign }) {
  // 생애주기 선택이 첫 번째 스텝 — 기본값을 "구독활성(Retention 대상)"으로 둬서, 갱신유예/장기만료
  // 고객이 일반 Retention 목록에 섞여 보이지 않게 한다. 필요하면 아래 탭에서 다른 상태로 바꿔 본다.
  const [lifecycleFilter, setLifecycleFilter] = useState("구독활성");
  const [riskFilter, setRiskFilter] = useState("all");
  const [segmentFilter, setSegmentFilter] = useState("all");
  const [page, setPage] = useState(1);
  const [customers, setCustomers] = useState([]);
  const [total, setTotal] = useState(0);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);

  useEffect(() => {
    if (!auth) return;
    setLoading(true);
    setError("");
    const params = new URLSearchParams({ page_size: String(AC_PAGE_SIZE), page: String(page) });
    if (lifecycleFilter !== "all") params.set("lifecycle_status", lifecycleFilter);
    if (riskFilter !== "all") params.set("risk_tier", riskFilter);
    if (segmentFilter !== "all") params.set("segment", segmentFilter);
    fetch(`${API_BASE}/admin/customers?${params.toString()}`, {
      headers: { Authorization: `Bearer ${auth.token}` },
    })
      .then((r) => {
        if (!r.ok) throw new Error(`고객 목록 조회 실패 (${r.status})`);
        return r.json();
      })
      .then((data) => {
        const items = data.items || [];
        setCustomers(items);
        setTotal(data.total || 0);
        setSelected(items[0] || null);
      })
      .catch((err) => setError(err.message))
      .finally(() => setLoading(false));
  }, [auth, lifecycleFilter, riskFilter, segmentFilter, page]);

  const totalPages = Math.max(1, Math.ceil(total / AC_PAGE_SIZE));
  const rangeStart = total === 0 ? 0 : (page - 1) * AC_PAGE_SIZE + 1;
  const rangeEnd = Math.min(page * AC_PAGE_SIZE, total);

  function changeFilter(setter, value) {
    setter(value);
    setPage(1); // 필터 바꾸면 1페이지부터 다시
  }

  return html`
    <div class="action-center">
      <div class="ac-lifecycle-tabs">
        <button
          type="button"
          class="lifecycle-tab ${lifecycleFilter === "all" ? "lifecycle-tab-active" : ""}"
          onClick=${() => changeFilter(setLifecycleFilter, "all")}
        >전체</button>
        ${LIFECYCLE_FILTER_META.map(
          (l) => html`
            <button
              key=${l.key}
              type="button"
              class="lifecycle-tab ${lifecycleFilter === l.key ? "lifecycle-tab-active" : ""}"
              onClick=${() => changeFilter(setLifecycleFilter, l.key)}
            >${l.label}</button>
          `
        )}
      </div>
      <div class="ac-filters">
        <div class="filter-block">
          <div class="filter-label">위험도</div>
          <select class="select" value=${riskFilter} onChange=${(e) => changeFilter(setRiskFilter, e.target.value)}>
            <option value="all">전체</option>
            <option value="고위험">고위험</option>
            <option value="저위험">저위험</option>
          </select>
        </div>
        <div class="filter-block">
          <div class="filter-label">월매출 세그먼트</div>
          <select class="select" value=${segmentFilter} onChange=${(e) => changeFilter(setSegmentFilter, e.target.value)}>
            <option value="all">전체</option>
            <option value="고위험/고가치">고위험/고월매출</option>
            <option value="고위험/저가치">고위험/저월매출</option>
            <option value="저위험/고가치">저위험/고월매출</option>
            <option value="저위험/저가치">저위험/저월매출</option>
          </select>
        </div>
        <div class="filter-count">전체 <b>${total.toLocaleString()}</b>명 중 ${rangeStart.toLocaleString()}–${rangeEnd.toLocaleString()}명 표시 (위험도 순)</div>
      </div>
      <div class="ac-body">
        <div class="ac-list-col">
          <div class="ac-table-wrap">
            ${loading
              ? html`<div class="detail-empty">불러오는 중...</div>`
              : error
              ? html`<div class="detail-empty">${error}</div>`
              : html`
                  <table class="ac-table">
                    <thead>
                      <tr>
                        <th>고객 ID (msno)</th>
                        <th>위험도</th>
                        <th>세그먼트</th>
                        <th>구독 상태</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${customers.map(
                        (c) => html`
                          <tr key=${c.msno} class=${selected && selected.msno === c.msno ? "row-selected" : ""} onClick=${() => setSelected(c)}>
                            <td class="mono-cell">${c.msno}</td>
                            <td><span class="chip ${c.risk_tier === "고위험" ? "chip-critical" : "chip-warning"} chip-sm">${c.churn_proba.toFixed(3)}</span></td>
                            <td>${displaySegment(c.segment)}</td>
                            <td>${formatLifecycle(c.lifecycle_status, c.days_to_expire).text}</td>
                          </tr>
                        `
                      )}
                    </tbody>
                  </table>
                `}
          </div>
          ${!loading && !error
            ? html`
                <div class="ac-pagination">
                  <button type="button" class="btn btn-ghost btn-sm" disabled=${page <= 1} onClick=${() => setPage((p) => Math.max(1, p - 1))}>← 이전</button>
                  <span class="small-muted">${page} / ${totalPages} 페이지</span>
                  <button type="button" class="btn btn-ghost btn-sm" disabled=${page >= totalPages} onClick=${() => setPage((p) => Math.min(totalPages, p + 1))}>다음 →</button>
                </div>
              `
            : null}
        </div>
        <${CustomerDetail}
          customer=${selected}
          draftCustomers=${draftCustomers}
          onAddToDraft=${onAddToDraft}
          onOpenCampaign=${onOpenCampaign}
        />
      </div>
      <p class="small-muted" style=${{ marginTop: "8px" }}>
        ※ 위 목록은 실제 DB(customer_churn_scores)에서 위험도 순으로 불러온 실데이터입니다 (${DATA_OBSERVED_AT}). 페이지당 ${AC_PAGE_SIZE}명씩 표시됩니다.
      </p>
    </div>
  `;
}

async function fetchCustomerTotal(auth, params) {
  const qs = new URLSearchParams({ page_size: "1", ...params });
  const res = await fetch(`${API_BASE}/admin/customers?${qs.toString()}`, {
    headers: { Authorization: `Bearer ${auth.token}` },
  });
  if (!res.ok) throw new Error(`고객 집계 조회 실패 (${res.status})`);
  const data = await res.json();
  return data.total || 0;
}

function LegacyAdminTab({ auth }) {
  const [kpis, setKpis] = useState(null);
  const [totalCustomers, setTotalCustomers] = useState(0);
  const [highRiskTotal, setHighRiskTotal] = useState(0);
  const [segmentCounts, setSegmentCounts] = useState({});
  const [ltvPriority, setLtvPriority] = useState([]);
  const [actionsSummary, setActionsSummary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!auth) return;
    setLoading(true);
    setError("");
    Promise.all([
      fetch(`${API_BASE}/admin/kpis`, { headers: { Authorization: `Bearer ${auth.token}` } }).then((r) => {

function AdminWorkspace({ auth, activeView, onNavigate, draftCustomers, onAddToDraft, onRemoveDraft, onClearDraft }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(() => {
    if (!auth) return;
    setLoading(true);
    setError("");
    const headers = { Authorization: `Bearer ${auth.token}` };
    const getJson = (path, label) => fetch(`${API_BASE}${path}`, { headers }).then(async (response) => {
      if (!response.ok) throw new Error(`${label} 조회 실패 (${response.status})`);
      return response.json();
    });
    Promise.all([
      getJson("/admin/overview", "운영 현황"),
      getJson("/admin/kpis", "분석 KPI"),
      getJson(`/admin/customers?${new URLSearchParams({ segment: "고위험/고가치", lifecycle_status: "구독활성", sort_by: "ltv_approx", page_size: "5" }).toString()}`, "우선순위 고객"),
      getJson("/admin/actions/summary", "발송 현황"),
      getJson("/admin/campaigns?limit=20", "캠페인 이력"),
    ])
      .then(([overview, kpis, priority, actionsSummary, campaigns]) => setData({ overview, kpis, priorityCustomers: priority.items || [], actionsSummary, campaigns }))
      .catch((err) => setError(err.message))
      .finally(() => setLoading(false));
  }, [auth, refreshKey]);

  if (loading) return html`<p class="section-intro">관리자 데이터를 불러오는 중...</p>`;
  if (error) return html`<div class="detail-empty">${error}</div>`;
  if (!data) return null;
  if (activeView === "overview") return html`<${OverviewView} overview=${data.overview} priorityCustomers=${data.priorityCustomers} actionsSummary=${data.actionsSummary} onNavigate=${onNavigate} />`;
  if (activeView === "analysis") return html`<${AnalysisView} overview=${data.overview} kpis=${data.kpis} />`;
  if (activeView === "customers") return html`<${CustomerView} auth=${auth} draftCustomers=${draftCustomers} onAddToDraft=${onAddToDraft} onOpenCampaign=${() => onNavigate("campaigns")} />`;
  if (activeView === "campaigns") return html`<${CampaignView} auth=${auth} overview=${data.overview} onCompleted=${() => setRefreshKey((value) => value + 1)} draftCustomers=${draftCustomers} onRemoveDraft=${onRemoveDraft} onClearDraft=${onClearDraft} />`;
  if (activeView === "history") return html`<${HistoryView} actionsSummary=${data.actionsSummary} campaigns=${data.campaigns} />`;
  return html`<${GovernanceView} overview=${data.overview} />`;
}

/* ============================== 로그인(관리자 전용) ============================== */

function LoginScreen({ onLogin }) {
  const [formTab, setFormTab] = useState("login"); // "login" | "signup"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);

  async function callApi(path, body) {
    setError("");
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.detail || `요청 실패 (${res.status})`);
      }
      return data;
    } finally {
      setLoading(false);
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    try {
      const data = await callApi("/auth/staff-login", { email, password });
      onLogin({ role: "admin", token: data.access_token, name: email });
    } catch (err) {
      setError(err.message);
    }
  }

  async function handleSignup(e) {
    e.preventDefault();
    try {
      await callApi("/auth/staff-signup", { email, password, name });
      setFormTab("login");
      setError("회원가입 완료! 이제 로그인해주세요.");
    } catch (err) {
      setError(err.message);
    }
  }

  return html`
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand">
          <span class="brand-mark">K</span>
          <div>
            <div class="login-title">KKBOX 이탈방지 관리자 콘솔</div>
            <div class="login-sub">운영팀 계정으로 로그인해주세요.</div>
          </div>
        </div>

        <div class="form-tab-row">
          <button type="button" class="form-tab ${formTab === "login" ? "form-tab-active" : ""}" onClick=${() => { setFormTab("login"); setError(""); }}>로그인</button>
          <button type="button" class="form-tab ${formTab === "signup" ? "form-tab-active" : ""}" onClick=${() => { setFormTab("signup"); setError(""); }}>회원가입</button>
        </div>

        ${formTab === "login" ? html`
          <form onSubmit=${handleLogin}>
            <div class="field-group">
              <label class="field-label">이메일</label>
              <input class="text-input" type="email" required value=${email}
                onInput=${(e) => setEmail(e.target.value)} placeholder="admin@team.com" />
            </div>
            <div class="field-group">
              <label class="field-label">비밀번호</label>
              <input class="text-input" type="password" required value=${password}
                onInput=${(e) => setPassword(e.target.value)} placeholder="••••••••" />
            </div>
            <button class="login-submit" type="submit" disabled=${loading}>${loading ? "로그인 중..." : "로그인"}</button>
          </form>
        ` : html`
          <form onSubmit=${handleSignup}>
            <div class="field-group">
              <label class="field-label">이름</label>
              <input class="text-input" type="text" required value=${name}
                onInput=${(e) => setName(e.target.value)} placeholder="홍길동" />
            </div>
            <div class="field-group">
              <label class="field-label">이메일</label>
              <input class="text-input" type="email" required value=${email}
                onInput=${(e) => setEmail(e.target.value)} placeholder="admin@team.com" />
            </div>
            <div class="field-group">
              <label class="field-label">비밀번호</label>
              <input class="text-input" type="password" required value=${password}
                onInput=${(e) => setPassword(e.target.value)} placeholder="8자 이상 + 특수문자 1개" />
            </div>
            <button class="login-submit" type="submit" disabled=${loading}>${loading ? "가입 중..." : "회원가입"}</button>
          </form>
        `}

        ${error ? html`<div class="login-error">${error}</div>` : null}
      </div>
    </div>
  `;
}

/* ============================== 루트 ============================== */

const ADMIN_AUTH_STORAGE_KEY = "kkbox_admin_auth";
const CAMPAIGN_DRAFT_STORAGE_KEY = "kkbox_admin_campaign_draft";

// 새로고침해도 로그인이 풀리지 않도록, 로그인 정보(토큰)를 localStorage에 저장해뒀다가
// 앱이 다시 켜질 때 그대로 복원한다. 로그아웃하면 지운다.
function loadStoredAdminAuth() {
  try {
    const raw = localStorage.getItem(ADMIN_AUTH_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function loadStoredCampaignDraft() {
  try {
    const raw = localStorage.getItem(CAMPAIGN_DRAFT_STORAGE_KEY);
    const items = raw ? JSON.parse(raw) : [];
    return Array.isArray(items) ? items.slice(0, 500) : [];
  } catch (e) {
    return [];
  }
}

function App() {
  const [auth, setAuth] = useState(loadStoredAdminAuth); // null | { role: "admin", token, name }
  const [activeView, setActiveView] = useState("overview");
  const [draftCustomers, setDraftCustomers] = useState(loadStoredCampaignDraft);

  useEffect(() => {
    try {
      localStorage.setItem(CAMPAIGN_DRAFT_STORAGE_KEY, JSON.stringify(draftCustomers));
    } catch (e) {}
  }, [draftCustomers]);

  function addToCampaignDraft(customer) {
    setDraftCustomers((current) => {
      if (current.some((item) => item.msno === customer.msno) || current.length >= 500) return current;
      return [...current, customer];
    });
  }

  function removeFromCampaignDraft(msno) {
    setDraftCustomers((current) => current.filter((customer) => customer.msno !== msno));
  }

  function clearCampaignDraft() {
    setDraftCustomers([]);
  }

  function handleLogin(newAuth) {
    setAuth(newAuth);
    try {
      localStorage.setItem(ADMIN_AUTH_STORAGE_KEY, JSON.stringify(newAuth));
    } catch (e) {}
  }

  function handleLogout() {
    setAuth(null);
    setDraftCustomers([]);
    try {
      localStorage.removeItem(ADMIN_AUTH_STORAGE_KEY);
      localStorage.removeItem(CAMPAIGN_DRAFT_STORAGE_KEY);
    } catch (e) {}
  }

  if (!auth) {
    return html`<${LoginScreen} onLogin=${handleLogin} />`;
  }

  const currentPage = ADMIN_NAV_ITEMS.find((item) => item.key === activeView) || ADMIN_NAV_ITEMS[0];

  return html`
    <div class="admin-shell">
      <header class="admin-sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark">K</span>
          <div>
            <div class="sidebar-brand-title">KKBOX Admin</div>
            <div class="sidebar-brand-sub">이탈방지 운영 콘솔</div>
          </div>
        </div>
        <div class="sidebar-label">운영 메뉴</div>
        <nav class="sidebar-nav" aria-label="관리자 메뉴">
          ${ADMIN_NAV_ITEMS.map((item) => html`
            <button key=${item.key} type="button" class="sidebar-nav-btn ${activeView === item.key ? "sidebar-nav-active" : ""}" onClick=${() => setActiveView(item.key)}>
              <span class="sidebar-nav-label">${item.label}</span>
              <span class="sidebar-nav-hint">${item.subtitle}</span>
            </button>
          `)}
        </nav>
        <div class="sidebar-meta">운영 시스템 정상<br />고객 데이터 연결됨</div>
      </header>
      <section class="admin-workspace">
        <header class="admin-topbar">
          <div><h1 class="page-title">${currentPage.label}</h1><div class="page-subtitle">${currentPage.subtitle}</div></div>
          <div class="admin-user-row">
            ${draftCustomers.length ? html`<button type="button" class="admin-draft-btn" onClick=${() => setActiveView("campaigns")}>캠페인 초안 ${draftCustomers.length}명</button>` : null}
            <span>${auth.name} · 운영자</span><button class="logout-btn" onClick=${handleLogout}>로그아웃</button>
          </div>
        </header>
        <main class="admin-page-content"><${AdminWorkspace} auth=${auth} activeView=${activeView} onNavigate=${setActiveView} draftCustomers=${draftCustomers} onAddToDraft=${addToCampaignDraft} onRemoveDraft=${removeFromCampaignDraft} onClearDraft=${clearCampaignDraft} /></main>
        <footer class="page-footer">KKBOX Retention Operations · 관리자 전용</footer>
      </section>
    </div>
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>
</body>
</html>
